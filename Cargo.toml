[package]
name = "ostt"
version = "0.0.26"
edition = "2021"
description = "Open Speech-to-Text recording tool with real-time volume metering and transcription"
authors = ["Kristofer Lund <kristoferlund@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/kristoferlund/ostt"
homepage = "https://github.com/kristoferlund/ostt"

[features]
# Enable NVIDIA CUDA GPU acceleration for local transcription.
# Requires CUDA toolkit at build time. The resulting binary dynamically links
# libcuda (from the NVIDIA driver) and libcublas at runtime.
# Built once per CUDA major version to produce the ostt-cuda (CUDA 12) and
# ostt-cuda13 (CUDA 13) release artifacts. The sonames differ per major
# (libcublas.so.12 vs libcublas.so.13) and are not interchangeable.
whisper-cuda = ["whisper-rs/cuda"]
# Enable Vulkan GPU acceleration for local transcription (AMD, Intel, NVIDIA).
# Requires Vulkan SDK (libvulkan-dev, glslang-tools) at build time. The resulting
# binary dynamically links libvulkan.so.1 (from Mesa or the NVIDIA ICD) at runtime.
# Used to produce the ostt-vulkan release artifacts.
whisper-vulkan = ["whisper-rs/vulkan"]

[dependencies]
# Terminal UI
ratatui = "0.29.0"
crossterm = "0.28.1"
cliclack = "0.3.0"
console = "0.15.8"
ctrlc = "3.5.1"
tui-input = "0.14.0"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

# Audio capture and processing
cpal = "0.16.0"
hound = "3.5.1"
rustfft = "6.2.0"

# Async runtime
tokio = { version = "1.48.0", features = ["full"] }

# Config and serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
indexmap = { version = "2.7.0", features = ["serde"] }
toml = "0.8.12"
dirs = "6.0.0"
anyhow = "1.0.86"
thiserror = "2.0.17"
regex = "1.10"
sha2 = "0.10.9"

# Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = [
  "env-filter",
  "fmt",
  "ansi",
] }
tracing-appender = "0.2.3"

# API calls for transcription
reqwest = { version = "0.12.24", features = ["json", "multipart", "stream"] }
futures-util = "0.3.31"
base64 = "0.22"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
urlencoding = "2.1.3"
whisper-rs = "0.16"
whisper-rs-sys = { git = "https://github.com/kristoferlund/whisper-rs", branch = "master" }

# Database for history
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
signal-hook = "0.3.18"

# Unix system calls (Linux-only for ALSA warning suppression)
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# Metal GPU acceleration for macOS (Apple Silicon and Intel).
# Shaders are embedded at build time (GGML_METAL_EMBED_LIBRARY=ON),
# so the binary is self-contained and works on all macOS machines.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

# whisper-rs upstream (codeberg.org/tazz4843/whisper-rs) has a broken vulkan.rs
# that imports ggml_backend_vk_* symbols renamed in ggml >=0.10. This patch
# replaces them with the new generic ggml_backend_dev_* API.
# Remove once upstream ships a fix.
[patch.crates-io]
whisper-rs = { git = "https://github.com/kristoferlund/whisper-rs", branch = "master" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
opt-level = "s"
strip = true

# Metadata for cargo-dist
[package.metadata.dist]
tap = "kristoferlund/ostt"

[package.metadata.deb]
name = "ostt"
maintainer = "Kristofer Lund <kristoferlund@users.noreply.github.com>"
copyright = "2024, Kristofer Lund"
license-file = ["LICENSE", "4"]
extended-description = """\
ostt (Open Speech-to-Text) is an interactive terminal-based audio recording \
and speech-to-text transcription tool. Record via microphone with real-time \
waveform visualization and transcribe using your choice of AI provider.\
"""
depends = "$auto, ffmpeg"
recommends = "wl-clipboard | xclip"
conflicts = "ostt-cuda, ostt-cuda13, ostt-vulkan"
replaces = "ostt-cuda, ostt-cuda13, ostt-vulkan"
section = "sound"
priority = "optional"
assets = [
    ["target/dist/ostt", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/ostt/README.md", "644"],
    ["LICENSE", "usr/share/doc/ostt/LICENSE", "644"],
    ["completions/ostt.bash", "usr/share/bash-completion/completions/ostt", "644"],
    ["completions/_ostt", "usr/share/zsh/site-functions/_ostt", "644"],
    ["completions/ostt.fish", "usr/share/fish/vendor_completions.d/ostt.fish", "644"],
]

# The CUDA variants cannot use `$auto`: dpkg-shlibdeps finds no libcuda.so.1 on
# the build runner (only the toolkit's stub) and no dpkg dependency information
# for libcublas, and cargo-deb runs it without --ignore-missing-info in a
# temporary directory where no shlibs.local can be supplied. `$auto` then gives
# up entirely rather than degrading -- the ostt-cuda package shipped declaring
# nothing but ffmpeg, having lost libc, libstdc++, ALSA and OpenSSL. So the base
# dependencies are spelled out, with the pre- and post-time_t-transition package
# names as alternatives (libasound2 became libasound2t64 in Ubuntu 24.04 and
# Debian 13; a versioned dependency is not satisfied by a virtual package).
# The versions come from the binary: built on ubuntu-22.04, it needs GLIBC 2.35
# and GLIBCXX_3.4.30 (libstdc++6 12). CI asserts every package names libc6.
#
# The CUDA runtime itself stays out of Depends -- and out of Recommends. It
# legitimately comes from outside dpkg (NVIDIA's .run installer), NVIDIA's apt
# packages are named per minor version (libcublas-12-6, ...), and the distro
# names (libcublas12) exist in Ubuntu 24.04 only. A Recommends naming any of
# them would be wrong on most systems, and libcudart / libcuda.so.1 fail first
# anyway. The installer script matches the variant to the installed runtime. Note the RPMs differ here -- cargo-generate-rpm's ELF
# auto-requires do declare libcublas.so.N and libcuda.so.1, so on Fedora and
# openSUSE the package refuses to install without a dpkg-visible CUDA runtime,
# and .run-installer users take the archive instead.
#
# The Vulkan variant is built on ubuntu-24.04, where libvulkan1 is dpkg-managed
# and `$auto` resolves completely; it must stay `$auto`, since that binary needs
# GLIBC 2.39 and libvulkan1 as hard dependencies.
[package.metadata.deb.variants.cuda]
name = "ostt-cuda"
depends = "libc6 (>= 2.35), libgcc-s1 (>= 3.0), libstdc++6 (>= 12), libasound2t64 (>= 1.0.29) | libasound2 (>= 1.0.29), libssl3t64 (>= 3.0.0) | libssl3 (>= 3.0.0), ffmpeg"
recommends = "wl-clipboard | xclip"
conflicts = "ostt, ostt-cuda13, ostt-vulkan"
replaces = "ostt, ostt-cuda13, ostt-vulkan"
provides = "ostt"
assets = [
    ["target/dist/ostt", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/ostt-cuda/README.md", "644"],
    ["LICENSE", "usr/share/doc/ostt-cuda/LICENSE", "644"],
    ["completions/ostt.bash", "usr/share/bash-completion/completions/ostt", "644"],
    ["completions/_ostt", "usr/share/zsh/site-functions/_ostt", "644"],
    ["completions/ostt.fish", "usr/share/fish/vendor_completions.d/ostt.fish", "644"],
]

[package.metadata.deb.variants.cuda13]
name = "ostt-cuda13"
depends = "libc6 (>= 2.35), libgcc-s1 (>= 3.0), libstdc++6 (>= 12), libasound2t64 (>= 1.0.29) | libasound2 (>= 1.0.29), libssl3t64 (>= 3.0.0) | libssl3 (>= 3.0.0), ffmpeg"
recommends = "wl-clipboard | xclip"
conflicts = "ostt, ostt-cuda, ostt-vulkan"
replaces = "ostt, ostt-cuda, ostt-vulkan"
provides = "ostt"
assets = [
    ["target/dist/ostt", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/ostt-cuda13/README.md", "644"],
    ["LICENSE", "usr/share/doc/ostt-cuda13/LICENSE", "644"],
    ["completions/ostt.bash", "usr/share/bash-completion/completions/ostt", "644"],
    ["completions/_ostt", "usr/share/zsh/site-functions/_ostt", "644"],
    ["completions/ostt.fish", "usr/share/fish/vendor_completions.d/ostt.fish", "644"],
]

[package.metadata.deb.variants.vulkan]
name = "ostt-vulkan"
depends = "$auto, ffmpeg"
recommends = "wl-clipboard | xclip"
conflicts = "ostt, ostt-cuda, ostt-cuda13"
replaces = "ostt, ostt-cuda, ostt-cuda13"
provides = "ostt"
assets = [
    ["target/dist/ostt", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/ostt-vulkan/README.md", "644"],
    ["LICENSE", "usr/share/doc/ostt-vulkan/LICENSE", "644"],
    ["completions/ostt.bash", "usr/share/bash-completion/completions/ostt", "644"],
    ["completions/_ostt", "usr/share/zsh/site-functions/_ostt", "644"],
    ["completions/ostt.fish", "usr/share/fish/vendor_completions.d/ostt.fish", "644"],
]

[package.metadata.generate-rpm]
name = "ostt"
license = "MIT"
summary = "Open Speech-to-Text: Terminal recording and transcription tool"
description = """\
ostt is an interactive terminal-based audio recording and speech-to-text \
transcription tool. Record via microphone with real-time waveform visualization \
and transcribe using your choice of AI provider.\
"""
[[package.metadata.generate-rpm.assets]]
source = "target/dist/ostt"
dest = "/usr/bin/ostt"
mode = "0755"

[package.metadata.generate-rpm.requires]
ffmpeg = "*"

[package.metadata.generate-rpm.recommends]
wl-clipboard = "*"

[[package.metadata.generate-rpm.assets]]
source = "README.md"
dest = "/usr/share/doc/ostt/README.md"
mode = "0644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "LICENSE"
dest = "/usr/share/doc/ostt/LICENSE"
mode = "0644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "completions/ostt.bash"
dest = "/usr/share/bash-completion/completions/ostt"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "completions/_ostt"
dest = "/usr/share/zsh/site-functions/_ostt"
mode = "0644"

[[package.metadata.generate-rpm.assets]]
source = "completions/ostt.fish"
dest = "/usr/share/fish/vendor_completions.d/ostt.fish"
mode = "0644"
